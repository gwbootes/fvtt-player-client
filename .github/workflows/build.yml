name: Build and Release

# Fires when a release is PUBLISHED, not when it is created.
# `created` never fires for draft releases, which is why every previous release
# had to have its binaries uploaded by hand. If you draft a release, fill it in,
# then hit Publish, `published` is the only event that reaches this workflow.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach binaries to (e.g. v2.0.1)"
        required: true
        type: string

# gh release upload writes to the repo. Without this the upload 403s.
permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # One platform failing must not stop the others from publishing. A Mac user
    # should still get their download if the rpm packager has a bad day.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: win32
            arch: x64
          - name: macOS (Apple Silicon)
            os: macos-latest
            platform: darwin
            arch: arm64
          - name: macOS (Intel)
            os: macos-latest
            platform: darwin
            arch: x64
          - name: Linux x64
            os: ubuntu-latest
            platform: linux
            arch: x64
          - name: Linux arm64
            os: ubuntu-latest
            platform: linux
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      # Resolve the tag once, strip the leading "v" for the package version.
      # A tag of v2.0.1 must produce a package version of 2.0.1 or npm rejects it.
      - name: Resolve version
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$TAG" ]; then echo "::error::No tag resolved"; exit 1; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "Building $TAG (package version ${TAG#v})"

      # maker-rpm needs rpmbuild and maker-deb needs fakeroot. Neither ships on
      # the ubuntu runner image, and forge reports their absence as a build
      # failure rather than a skip.
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm fakeroot dpkg

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # npm pkg set instead of `yarn version`, which errors out when the new
      # version matches the current one. Re-running a release must be harmless.
      - name: Stamp version
        shell: bash
        run: npm pkg set version="$VERSION"

      - name: Build
        shell: bash
        run: yarn make --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      # Collect by extension rather than by exact path. The old workflow used
      # hardcoded `mv` paths, so any change in how forge names its output killed
      # the job. Matching on extension survives that.
      #
      # `find` rather than a `**` glob: macOS runners still ship bash 3.2 as
      # /bin/bash, which predates globstar by two major versions, so
      # `shopt -s globstar` is a hard error there and takes the step down with
      # it. Linux and Git Bash on Windows are both modern enough not to care,
      # which is what made this look like a Mac-only problem.
      - name: Collect artifacts
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          NAME="vtt-desktop-client"
          ARCH="${{ matrix.arch }}"
          found=0
          find out/make -type f > artifact-list.txt
          while IFS= read -r f; do
            base="$(basename "$f")"
            case "$f" in
              *.exe)   cp "$f" "dist/${NAME}-windows-${ARCH}-${VERSION}-setup.exe" ;;
              *.dmg)   cp "$f" "dist/${NAME}-macos-${ARCH}-${VERSION}.dmg" ;;
              *.deb)   cp "$f" "dist/${NAME}_${VERSION}_${ARCH}.deb" ;;
              *.rpm)   cp "$f" "dist/$base" ;;
              *.nupkg) cp "$f" "dist/$base" ;;
              */RELEASES) cp "$f" "dist/RELEASES" ;;
              *.zip)
                case "${{ matrix.platform }}" in
                  win32)  cp "$f" "dist/${NAME}-windows-${ARCH}-portable-${VERSION}.zip" ;;
                  darwin) cp "$f" "dist/${NAME}-macos-${ARCH}-${VERSION}.zip" ;;
                  linux)  cp "$f" "dist/${NAME}-linux-${ARCH}-${VERSION}.zip" ;;
                esac
                ;;
              *) continue ;;
            esac
            found=$((found + 1))
          done < artifact-list.txt
          rm -f artifact-list.txt
          if [ "$found" -eq 0 ]; then
            echo "::error::forge produced no recognisable artifacts"
            find out/make -type f || true
            exit 1
          fi
          echo "Collected $found artifact(s):"
          ls -lh dist/

      # Straight to the release. No upload-artifact/download-artifact round trip
      # and no separate publish job: the v2 artifact actions the old workflow
      # used were retired in 2024 and hard-fail, and gh is preinstalled on every
      # runner, so this has nothing left in it that can rot.
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/* --clobber
